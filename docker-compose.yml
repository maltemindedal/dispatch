# PostgreSQL for the `postgres` Spring profile.
#
#   docker compose up -d
#   ./gradlew :dispatch-api:bootRun --args='--spring.profiles.active=postgres'
#
# The application creates its own schema on startup, so there is nothing to run by hand.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dispatch-postgres
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
    ports:
      - "5432:5432"
    volumes:
      - dispatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Wait for real readiness rather than for the port to open; PostgreSQL briefly accepts
      # connections during init and then restarts, which is exactly when a starting app connects.
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    command:
      # The queue leans on row locks, and a stuck lock should surface as an error rather than as a
      # worker that hangs forever.
      - "postgres"
      - "-c"
      - "lock_timeout=10s"
      - "-c"
      - "log_min_duration_statement=500"

  # A second application instance is not defined here on purpose: build the jar once and run two
  # of them yourself (two bootRun invocations would contend on the same Gradle project lock):
  #   ./gradlew :dispatch-api:bootJar
  #   java -jar dispatch-api/build/libs/dispatch-api-0.1.0-SNAPSHOT.jar --spring.profiles.active=postgres --server.port=8080
  #   java -jar dispatch-api/build/libs/dispatch-api-0.1.0-SNAPSHOT.jar --spring.profiles.active=postgres --server.port=8081
  # and watch SELECT ... FOR UPDATE SKIP LOCKED keep them from processing the same job twice.
  # The walkthrough lives in docs/guides/running-multiple-instances.md.

volumes:
  dispatch-pgdata:
