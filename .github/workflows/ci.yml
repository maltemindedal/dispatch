name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-and-test only, so a read-only token is enough.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, with the release in the comment: a tag can be
      # moved after the fact, a commit cannot. Bump them deliberately.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes, so the job's token has no business staying in the workspace.
          persist-credentials: false

      # Satisfies the build's Java 21 toolchain directly, so the foojay resolver
      # doesn't have to download one.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Verifies the committed gradle-wrapper.jar against known-good checksums.
          validate-wrappers: true

      # No `services:` block: the dispatch-postgres and dispatch-api integration
      # tests use Testcontainers, which starts its own PostgreSQL on the runner's
      # Docker daemon. dispatch-core needs no Docker at all.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
          retention-days: 14
