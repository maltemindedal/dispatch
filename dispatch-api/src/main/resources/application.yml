spring:
  application:
    name: dispatch

  # No profile on the command line means local development, which means H2.
  profiles:
    default: dev

  # Handle HTTP requests on virtual threads too, matching the worker pool. Nothing in the engine
  # depends on this. It keeps the whole application consistent about how it uses threads.
  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    # Boot 4 moved to Jackson 3, whose own defaults differ from Jackson 2's. This is Boot's switch
    # for configuring it the way Boot configured Jackson 2, so the request and response format
    # stays what it was. RestContractTest holds the wire format to that.
    use-jackson2-defaults: true

server:
  # On SIGTERM, stop accepting requests and let in-flight ones finish before the context closes.
  # The queue's own draining then happens when the JobQueue bean is destroyed.
  shutdown: graceful

dispatch:
  # jdbc (shared and durable) or memory (process-local, lost on restart)
  store: jdbc

  # Blank means "generate a unique one at startup". Set this only if you have a stable per-replica
  # identity, and keep it unique: instances sharing one look the same in locked_by and the logs.
  worker-id: ""

  concurrency: 16
  claim-batch-size: 8
  poll-interval: 250ms

  # Must comfortably exceed your slowest handler, or healthy jobs get run twice.
  visibility-timeout: 5m

  maintenance-interval: 1s
  maintenance-batch-size: 500

  # How long a shutdown waits for in-flight jobs before interrupting them.
  shutdown-drain-timeout: 30s

  retry:
    base-delay: 1s
    multiplier: 2.0
    max-delay: 1m
    jitter-factor: 0.5

  # Register the bundled send-email and resize-image simulators. Turn off in a real deployment.
  demo-handlers: true

  # The largest POST /jobs body the API parses, in bytes (1 MiB). Bigger bodies get a 413. Enforced
  # by the JSON parser as it reads, in steps of its input buffer (about 8 KB), so a body can pass by
  # up to that much before it is refused.
  max-payload-bytes: 1048576

logging:
  level:
    dev.dispatch: INFO
