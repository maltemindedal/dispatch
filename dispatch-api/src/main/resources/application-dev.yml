# Local development: H2 in memory, no Docker required.
#
# The same JdbcJobStore runs here as against PostgreSQL — same SQL, same claim query. What H2 does
# not reproduce is contention behaviour: its locking is coarser, so a second instance pointed at
# the same H2 database gets empty claims rather than the next unlocked rows. Single instance is
# fine; for anything multi-instance, run the postgres profile.
spring:
  datasource:
    url: jdbc:h2:mem:dispatch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    dev.dispatch: DEBUG
