# Local development: H2 in memory, no Docker required.
#
# The same JdbcJobRows runs here as against PostgreSQL, with the same SQL and claim query. What H2 does
# not reproduce is contention behaviour: its locking is coarser, so a second instance pointed at
# the same H2 database gets empty claims rather than the next unlocked rows. Single instance is
# fine; for anything multi-instance, run the postgres profile. H2 also scans every PENDING row on
# each claim (it cannot order a FOR UPDATE query by index), so a backlog of tens of thousands of
# jobs is slow here; see docs/reference/configuration.md.
spring:
  datasource:
    url: jdbc:h2:mem:dispatch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20

  # The H2 web console runs SQL and, through H2's own features, arbitrary code, and this is the
  # profile people start by accident. So it is off unless asked for:
  #   DISPATCH_H2_CONSOLE=true ./gradlew :dispatch-api:bootRun
  # It is then served at /h2-console, only to peers on the local machine.
  h2:
    console:
      enabled: ${DISPATCH_H2_CONSOLE:false}
      path: /h2-console

logging:
  level:
    dev.dispatch: DEBUG
