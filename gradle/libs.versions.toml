[versions]
springBoot = "4.1.1"
# Patch releases pinned above what the Boot 4.1.1 BOM manages; see dispatch-api/build.gradle.kts.
tomcat = "11.0.26"
jacksonBom = "3.2.3"
postgresql = "42.7.13"
h2 = "2.5.252"
# The pool the app ships (the Boot 4.1 BOM manages it); the store tests should run against it.
hikari = "7.1.0"
slf4j = "2.0.20"
logback = "1.6.5"
junit = "6.1.3"
awaitility = "4.3.0"
assertj = "3.27.7"
testcontainers = "2.0.5"

[libraries]
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jacksonBom" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
